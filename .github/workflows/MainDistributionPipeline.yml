name: Main Extension Distribution Pipeline

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/master' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5-variegata
      extension_name: raster
      extra_toolchains: rust
      exclude_archs: 'linux_arm64;wasm_mvp;wasm_eh;windows_amd64_mingw;windows_amd64_rtools'
      skip_tests: true
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: duckdb-stable-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - name: Rename release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for artifact_dir in artifacts/*; do
            [ -d "$artifact_dir" ] || continue
            artifact_name=$(basename "$artifact_dir")
            platform_suffix="${artifact_name##*-extension-}"
            for asset in "$artifact_dir"/*.duckdb_extension; do
              [ -f "$asset" ] || continue
              asset_name=$(basename "$asset")
              stem="${asset_name%.duckdb_extension}"
              cp "$asset" "release-assets/${stem}-${platform_suffix}.duckdb_extension"
            done
          done
          ls -la release-assets/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

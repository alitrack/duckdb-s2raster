[package]
name = "duckdb_raster"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension: S2 geography + ST_Transform + raster — ported from SedonaDB algorithms"
license = "MIT"
repository = "https://github.com/alitrack/duckdb-raster"

[lib]
name = "duckdb_raster"
crate-type = ["cdylib", "rlib"]

[dependencies]
duckdb = { version = "~1.10504.0", features = ["vscalar", "vscalar-arrow"] }
arrow = "58"
s2 = "0.1"
geo = "0.29"
proj = { version = "0.29", features = ["bundled_proj"] }
tiff = "0.10"
byteorder = "1.5"
wkt = "0.11"
thiserror = "2"

[features]
default = []
loadable-extension = ["duckdb/loadable-extension"]
test-bundled = ["duckdb/bundled"]

[[test]]
name = "integration_test"
required-features = ["test-bundled"]

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
            platform: linux_amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dylib
            platform: osx_arm64
          - os: macos-13
            target: x86_64-apple-darwin
            ext: dylib
            platform: osx_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: |
          python3 metadata.py \
            target/${{ matrix.target }}/release/libduckdb_raster.${{ matrix.ext }} \
            -o raster-${{ matrix.platform }}.duckdb_extension \
            --platform ${{ matrix.platform }} \
            --duckdb-version v1.5.4
      - uses: softprops/action-gh-release@v2
        with:
          files: raster-${{ matrix.platform }}.duckdb_extension

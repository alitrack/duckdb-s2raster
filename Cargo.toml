[package]
name = "duckdb_raster"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension: S2 geography + GeoTIFF raster — pure Rust, zero system deps"
license = "MIT"
repository = "https://github.com/alitrack/duckdb-raster"

[lib]
name = "duckdb_raster"
crate-type = ["cdylib", "rlib"]

[dependencies]
duckdb = { version = "~1.10504.0", features = ["vscalar", "vscalar-arrow"] }
arrow = "58"
s2 = "0.1"
geo = "0.29"
tiff = "0.10"
byteorder = "1.5"
wkt = "0.11"
thiserror = "2"
dashmap = "6"

[features]
default = []
loadable-extension = ["duckdb/loadable-extension", "duckdb/bundled"]
test-bundled = ["duckdb/bundled"]

[profile.release]
lto = true
strip = true
opt-level = 3

[[test]]
name = "integration_test"
